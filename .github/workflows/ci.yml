name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('chunking/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project in editable mode with dev extras.
          # This avoids sys.path hacks and validates pyproject.toml resolution.
          pip install -e ".[dev]"

      - name: Download NLTK punkt (required by SemanticChunker)
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True); nltk.download('punkt', quiet=True)"

      - name: Run unit tests
        run: |
          pytest \
            chunking/tests/ \
            embeddings/tests/ \
            vectorstores/tests/ \
            retrieval/tests/ \
            -v --tb=short \
            --cov=chunking --cov=embeddings --cov=vectorstores --cov=retrieval \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
