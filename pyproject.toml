[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipelines"
version = "0.1.0"
description = "Modular RAG evaluation framework — chunking, embeddings, retrieval, and end-to-end benchmarks on FDA biomarker text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core dependencies are split by layer in chunking/requirements.txt.
# This section intentionally lists only what is needed for `pip install -e .`
# to resolve imports in tests and experiment runners.
dependencies = [
    "tiktoken>=0.7.0",
    "numpy>=1.26.0,<2.0",
    "nltk>=3.9.0",
]

[project.optional-dependencies]
# pip install -e ".[chunking]"
chunking = [
    "sentence-transformers==2.7.0",
    "transformers==4.44.2",
    "langchain-text-splitters>=0.3.0",
]
# pip install -e ".[vectorstore]"
vectorstore = [
    "chromadb>=0.5.0",
]
# pip install -e ".[experiments]"
experiments = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
]
# pip install -e ".[dev]"  — everything needed to run the full test suite
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sentence-transformers==2.7.0",
    "transformers==4.44.2",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
]
# pip install -e ".[all]"  — full install
all = [
    "sentence-transformers==2.7.0",
    "transformers==4.44.2",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
# Discover all packages under the project root.
# Excludes data directories, experiment scripts' transitive imports of
# non-package paths, and the virtual environment.
where = ["."]
exclude = [
    "venv*",
    "data_ingestion*",
    "datasets*",
    "*.egg-info",
]

[tool.pytest.ini_options]
# Run all unit tests (no API keys, no model downloads required).
testpaths = [
    "chunking/tests",
    "embeddings/tests",
    "vectorstores/tests",
    "retrieval/tests",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["chunking", "embeddings", "vectorstores", "retrieval", "evaluation"]
omit = ["*/tests/*", "experiments/*", "data_ingestion/*"]
